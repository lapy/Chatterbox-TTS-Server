server:
  host: 127.0.0.1
  port: 8004
  use_ngrok: false
  use_auth: false
  auth_username: user
  auth_password: password
  cors_allow_all: false
  cors_origins: []
  max_concurrent_tts_requests: 0
  enable_performance_monitor: false
  performance_cuda_sync: false
  log_file_path: logs/tts_server.log
  log_file_max_size_mb: 10
  log_file_backup_count: 5
  ssl_certfile: null
  ssl_keyfile: null
model:
  repo_id: chatterbox-turbo
tts_engine:
  device: cuda
  predefined_voices_path: voices
  reference_audio_path: reference_audio
  default_voice_id: default_sample.wav
  chunk_batch_size: 1
  chunk_quality_max_retries: 0
asr:
  enabled: false
  openai_compatible_base_url: ''
  access_token: ''
  model: whisper-1
  min_similarity: 0.82
  timeout_sec: 120.0
  language: ''
  skip_if_text_shorter_than: 12
paths:
  model_cache: model_cache
  output: outputs
generation_defaults:
  temperature: 0.8
  exaggeration: 1.25
  cfg_weight: 0.6
  seed: 0
  speed_factor: 1
  language: en
  turbo_repetition_penalty: 1.2
audio_output:
  format: wav
  sample_rate: 24000
  max_reference_duration_sec: 30
  save_to_disk: false
  codec_timing:
    lossy_short_leading_pad_sec: 0.35
    lossy_multichunk_leading_pad_sec: 2.5
    lossy_trailing_flush_sec: 0.1
    streaming_opus_preroll_sec: 2.5
    streaming_mp3_min_pcm_sec: 2.6
    streaming_inter_chunk_gap_sec: 0.03
audio_processing:
  enable_crossfade: true
  enable_silence_trimming: false
  enable_internal_silence_fix: false
  enable_unvoiced_removal: false
  gentle_cleanup:
    enabled: false
    enable_highpass: true
    highpass_hz: 80.0
    enable_loudness_normalization: true
    target_lufs: -18.0
    enable_true_peak_limiter: true
    true_peak_limit: 0.95
text_processing:
  enable_spoken_normalization: true
  custom_replacements: {}
request_limits:
  max_text_chars: 20000
ui_state:
  last_text: '[sigh] Okay, once upon a time there was a princess. [groan] No, you''re
    right, we did princess yesterday. Fine, a dragon. [cough] Excuse me. So there
    was this dragon, and he lived in a cave. [sniff] A very nice cave with excellent
    property values. [chuckle] No, dragons don''t pay rent, they just take caves.
    That''s called squatting. Never mind, forget I said that. [clear throat] Anyway,
    the dragon was very lonely because... [gasp] What do you mean you want a glass
    of water? You just had water! [sigh] Fine, here''s your water. [groan] Where was
    I? Right, lonely dragon. So he decided to make friends with the village nearby.
    [laugh] No, he didn''t eat anyone! This is a friendly dragon! [shush] Lower your
    voice, your sister is sleeping. [sniff] So the dragon brought everyone cookies.
    [cough] Yes, dragons can bake. [chuckle] It''s a magical world, anything is possible.
    Except sleeping through the night, apparently. [sigh] And they all became best
    friends and lived happily ever after and went to sleep immediately. The end! [gasp]
    What do you mean what happened next? That''s the whole story! [groan] Okay, okay,
    one more chapter. [sigh] The dragon also had a pet... unicorn. And the unicorn''s
    name was... [sniff] Please Fall Asleep the Third. And the unicorn''s special power
    was making children very, very drowsy...

    '
  last_voice_mode: predefined
  last_predefined_voice: Olivia.wav
  last_reference_file: none
  last_seed: 0
  last_chunk_size: 200
  last_split_text_enabled: true
  last_temperature: 0.75
  last_exaggeration: 1.1
  last_cfg_weight: 0.55
  last_language: en
  last_speed_factor: 1
  last_output_format: mp3
  last_stream_tts_enabled: true
  last_model_repo_id: chatterbox-turbo
  hide_chunk_warning: false
  hide_generation_warning: true
  theme: light
  last_preset_name: "\u26A1 Turbo: The Overworked Parent's Bedtime Story"
ui:
  title: Chatterbox TTS Server
  show_language_select: true
  max_predefined_voices_in_dropdown: 20
debug:
  save_intermediate_audio: false
