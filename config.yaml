server:
  host: 127.0.0.1
  port: 8004
  use_ngrok: false
  use_auth: false
  auth_username: user
  auth_password: password
  cors_allow_all: false
  cors_origins: []
  max_concurrent_tts_requests: 0
  enable_performance_monitor: false
  performance_cuda_sync: false
  log_file_path: logs/tts_server.log
  log_file_max_size_mb: 10
  log_file_backup_count: 5
  ssl_certfile: null
  ssl_keyfile: null
model:
  repo_id: chatterbox-turbo
tts_engine:
  device: cuda
  predefined_voices_path: voices
  reference_audio_path: reference_audio
  default_voice_id: Abigail.wav
  chunk_batch_size: 0
  chunk_quality_max_retries: 0
asr:
  enabled: false
  openai_compatible_base_url: ''
  access_token: ''
  model: whisper-1
  min_similarity: 0.82
  timeout_sec: 120
  language: ''
  skip_if_text_shorter_than: 12
paths:
  model_cache: model_cache
  output: outputs
generation_defaults:
  temperature: 0.8
  exaggeration: 1.25
  cfg_weight: 0.6
  seed: 0
  speed_factor: 1
  language: en
  turbo_repetition_penalty: 1.2
audio_output:
  format: wav
  sample_rate: 24000
  max_reference_duration_sec: 30
  save_to_disk: false
  codec_timing:
    lossy_short_leading_pad_sec: 0.35
    lossy_multichunk_leading_pad_sec: 2.5
    lossy_trailing_flush_sec: 0.1
    streaming_opus_preroll_sec: 2.5
    streaming_mp3_min_pcm_sec: 2.6
    streaming_inter_chunk_gap_sec: 0.03
audio_processing:
  enable_crossfade: true
  enable_silence_trimming: false
  enable_internal_silence_fix: false
  enable_unvoiced_removal: false
  gentle_cleanup:
    enabled: false
    enable_highpass: true
    highpass_hz: 80.0
    enable_loudness_normalization: true
    target_lufs: -18.0
    enable_true_peak_limiter: true
    true_peak_limit: 0.95
text_processing:
  enable_spoken_normalization: true
  custom_replacements: {}
request_limits:
  max_text_chars: 20000
ui_state:
  last_text: "You think you've won, don't you? Standing there with your righteous\
    \ sword and your noble heart. How delightfully naive. I've been playing this game\
    \ since before your grandmother's grandmother was a whisper in the wind. Every\
    \ move you've made, every clever plan, every supposed victory \u2014 all pieces\
    \ on my board, my dear hero. You see a villain who lost. I see a centuries-old\
    \ design finally coming to fruition. The curse you think you've broken? It was\
    \ merely the lock. And you, sweet child, have just handed me the key. Now, if\
    \ you'll excuse me, I have a kingdom to reshape in my image. Don't look so surprised.\
    \ In every story, someone has to play the monster. I simply chose to be the very\
    \ best.\n"
  last_voice_mode: predefined
  last_predefined_voice: Olivia.wav
  last_reference_file: none
  last_seed: 666
  last_chunk_size: 200
  last_split_text_enabled: true
  last_temperature: 0.8
  last_exaggeration: 1.3
  last_cfg_weight: 0.6
  last_language: en
  last_speed_factor: 1
  last_output_format: mp3
  last_stream_tts_enabled: true
  last_model_repo_id: chatterbox-turbo
  hide_chunk_warning: false
  hide_generation_warning: true
  theme: dark
  last_preset_name: Fairy Tale Villain Monologue
ui:
  title: Chatterbox TTS Server
  show_language_select: true
  max_predefined_voices_in_dropdown: 20
debug:
  save_intermediate_audio: false
