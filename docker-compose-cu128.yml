services:
  chatterbox-tts-server:
    build:
      context: .
      dockerfile: Dockerfile.cu128
      args:
        RUNTIME: nvidia
    image: chatterbox-tts-server:cu128
    container_name: chatterbox-tts-server-cu128
    ports:
      - "8004:8004"
    volumes:
      - ./model_cache:/app/model_cache
      - ./reference_audio:/app/reference_audio
      - ./outputs:/app/outputs
      - ./voices:/app/voices
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ~/.cache/huggingface:/app/hf_cache
    environment:
      - CHATTERBOX_SERVER_HOST=0.0.0.0
      - HF_TOKEN=YOUR_TOKEN_HERE
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped
